<div class="rv" style="display: flex; flex-direction: column; gap: 14px">
<div class="lift" style="aspect-ratio: 3 / 4; background: #F7F4EE; border: 1px solid #D9D2C3; border-radius: 4px; padding: 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden">
<span style="position: relative; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: #7C5E26; font-weight: 500">{{series}}</span>
<span style="position: relative; font-family: 'EB Garamond', serif; font-size: 30px; line-height: 1.1; color: #1B2F47">{{title}}</span>
<span style="position: relative; font-family: 'EB Garamond', serif; font-style: italic; font-size: 17px; color: #33445A">{{subtitle}}</span>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 32%; background: #14304F; border-radius: 60% 40% 0 0 / 30% 30% 0 0"></div>
<span style="position: absolute; left: 26px; bottom: 20px; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: #F7F4EE">{{author}}</span>
</div>
<p style="margin: 0; font-size: 15px; color: #4E5D6E">{{status}}</p>
</div>
